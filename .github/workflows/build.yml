name: Build

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build
        run: nix develop -c env PATH="$(/nix/var/nix/profiles/default/bin/nix --version >/dev/null; echo /nix/var/nix/profiles/default/bin:/usr/bin:/bin)" cargo build

